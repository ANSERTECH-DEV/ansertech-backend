spring:
  application:
    name: ansertech-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:ansertech_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Lima

server:
  port: ${SERVER_PORT:8080}

# ===== JWT =====
jwt:
  secret: ${JWT_SECRET:ansertechSuperSecretKeyForJWTTokenGeneration2026MinLength256Bits}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}  # 8 horas

# ===== Google Vertex AI / Gemini =====
vertex-ai:
  project-id: ${GCP_PROJECT_ID:ansertech-rfq-prod}
  location: ${GCP_LOCATION:us-central1}
  model: gemini-2.5-flash
  #credentials-file: ${GOOGLE_APPLICATION_CREDENTIALS:./gcp-credentials.json}

# ===== Microsoft OAuth2 & Graph API =====
spring.security.oauth2.client.registration.microsoft.client-id: ${GRAPH_CLIENT_ID:}
spring.security.oauth2.client.registration.microsoft.client-secret: ${GRAPH_CLIENT_SECRET:}
spring.security.oauth2.client.registration.microsoft.scope: openid, profile, email, offline_access, Mail.Read, Mail.ReadWrite
spring.security.oauth2.client.registration.microsoft.authorization-grant-type: authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri: "{baseUrl}/login/oauth2/code/microsoft"

spring.security.oauth2.client.provider.microsoft.authorization-uri: https://login.microsoftonline.com/${GRAPH_TENANT_ID:common}/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri: https://login.microsoftonline.com/${GRAPH_TENANT_ID:common}/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.jwk-set-uri: https://login.microsoftonline.com/${GRAPH_TENANT_ID:common}/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-info-uri: https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.microsoft.user-name-attribute: sub

microsoft:
  graph:
    client-id: ${GRAPH_CLIENT_ID:}
    tenant-id: ${GRAPH_TENANT_ID:consumers}

  polling:
    enabled: true
    fixed-delay-ms: 120000
    initial-delay-ms: 10000
    max-messages-per-poll: 5

  classification:
    confidence-threshold: 0.85
#email:
  #imap:
    #host: ${EMAIL_IMAP_HOST:imap.gmail.com}
    #port: ${EMAIL_IMAP_PORT:993}
    #username: ${EMAIL_IMAP_USERNAME:}
    #password: ${EMAIL_IMAP_PASSWORD:}
  #polling:
    #enabled: ${EMAIL_POLLING_ENABLED:false}
    #fixed-delay-ms: ${EMAIL_POLLING_DELAY_MS:120000}  # 2 minutos
    #max-results: 50
  #classification:
    #confidence-threshold: 0.85

# ===== Almacenamiento PDF =====
storage:
  base-path: ${STORAGE_PATH:./storage}
  quotations-dir: quotations

# ===== CORS =====
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

# ===== Springdoc / Swagger =====
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

logging:
  level:
    com.ansertech: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
